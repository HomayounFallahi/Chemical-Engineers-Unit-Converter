<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unit Converter — Chemical Engineering</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F6F4EE;
  --paper-raised:#FFFFFF;
  --paper-sunken:#EEEBE1;
  --ink:#20242A;
  --ink-soft:#565F68;
  --ink-faint:#9BA3AA;
  --line:#DBD5C6;
  --line-strong:#C7C0AE;
  --accent:#A9631A;
  --accent-hover:#8C5717;
  --accent-tint:#F0E2D0;
  --accent2:#1E8B74;
  --accent2-tint:#DCEBE7;
  --readout-bg:#F1EEE6;
  --readout-bg-2:#FBFAF6;
  --readout-fg:#1E8B74;
  --readout-fg-dim:#6E7B75;
  --readout-line:#D7D0C3;
  --danger:#A6362C;
  --danger-bg:#F7E4E1;
  --shadow:0 1px 2px rgba(32,36,42,0.06), 0 8px 24px rgba(32,36,42,0.08);
  --shadow-sm:0 1px 2px rgba(32,36,42,0.08);
  --radius:10px;
  --font-ui:'IBM Plex Sans',-apple-system,BlinkMacSystemFont,sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
}
.dark-mode{
  --paper:#14181B;
  --paper-raised:#1B2024;
  --paper-sunken:#0F1315;
  --ink:#E9ECE9;
  --ink-soft:#A6AEA9;
  --ink-faint:#6C766F;
  --line:#2A3134;
  --line-strong:#38403F;
  --accent:#D89A4A;
  --accent-hover:#EBAE5E;
  --accent-tint:#3A2C18;
  --accent2:#62CBAF;
  --accent2-tint:#12362E;
  --readout-bg:#0A0E10;
  --readout-bg-2:#080B0C;
  --readout-fg:#7AD7B4;
  --readout-fg-dim:#4E8E72;
  --readout-line:#1A2422;
  --danger:#E5867D;
  --danger-bg:#3A1E1C;
  --shadow:0 1px 2px rgba(0,0,0,0.3), 0 8px 28px rgba(0,0,0,0.4);
  --shadow-sm:0 1px 2px rgba(0,0,0,0.3);
}
*{margin:0;padding:0;box-sizing:border-box;}
body{
  font-family:var(--font-ui);
  background:var(--paper);
  color:var(--ink);
  min-height:100vh;
  padding:28px 16px 40px;
  transition:background 0.25s ease,color 0.25s ease;
}
body::before{
  content:'';
  position:fixed;inset:0;
  background-image:
    linear-gradient(var(--line) 1px, transparent 1px),
    linear-gradient(90deg, var(--line) 1px, transparent 1px);
  background-size:28px 28px;
  opacity:0.35;
  pointer-events:none;
  z-index:0;
}
.app-shell{
  position:relative;
  z-index:1;
  max-width:900px;
  margin:0 auto;
}

/* ---------- Header ---------- */
.masthead{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:16px;
  margin-bottom:20px;
  flex-wrap:wrap;
}
.masthead-titles{display:flex;flex-direction:column;gap:2px;}
.eyebrow{
  font-family:var(--font-mono);
  font-size:11px;
  letter-spacing:0.14em;
  text-transform:uppercase;
  color:var(--accent2);
  font-weight:600;
}
h1{
  font-size:26px;
  font-weight:700;
  letter-spacing:-0.01em;
}
.masthead-controls{
  display:flex;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
}

/* Theme toggle styled like a rocker switch */
.theme-switch{
  position:relative;
  width:52px;height:28px;
  background:var(--paper-sunken);
  border:1px solid var(--line-strong);
  border-radius:16px;
  cursor:pointer;
  display:block;
  flex-shrink:0;
}
.theme-switch input{position:absolute;opacity:0;width:100%;height:100%;cursor:pointer;margin:0;}
.theme-knob{
  position:absolute;
  top:2px;left:2px;
  width:22px;height:22px;
  border-radius:50%;
  background:var(--paper-raised);
  box-shadow:var(--shadow-sm);
  transition:transform 0.25s ease,background 0.25s ease;
  display:flex;align-items:center;justify-content:center;
}
.theme-knob svg{width:13px;height:13px;stroke:var(--accent);fill:none;}
.dark-mode .theme-knob{transform:translateX(24px);background:var(--readout-bg);}
.dark-mode .theme-knob svg{stroke:var(--readout-fg);}

.btn{
  font-family:var(--font-ui);
  font-size:13px;
  font-weight:600;
  border-radius:8px;
  border:1px solid transparent;
  padding:9px 14px;
  cursor:pointer;
  transition:all 0.15s ease;
  display:inline-flex;align-items:center;gap:6px;
  white-space:nowrap;
}
.btn-primary{background:var(--accent);color:#fff;}
.btn-primary:hover{background:var(--accent-hover);}
.btn-ghost{background:var(--paper-raised);color:var(--ink-soft);border-color:var(--line);}
.btn-ghost:hover{border-color:var(--line-strong);color:var(--ink);}
.btn-icon{padding:8px;border-radius:7px;}
.btn svg{width:14px;height:14px;flex-shrink:0;}

/* ---------- Search ---------- */
.search-wrap{position:relative;margin-bottom:14px;}
.search-field{
  display:flex;align-items:center;gap:8px;
  background:var(--paper-raised);
  border:1px solid var(--line);
  border-radius:9px;
  padding:10px 12px;
}
.search-field svg{width:16px;height:16px;stroke:var(--ink-faint);flex-shrink:0;}
.search-field input{
  border:none;outline:none;background:transparent;
  font-family:var(--font-ui);font-size:14px;color:var(--ink);
  width:100%;
}
.search-field input::placeholder{color:var(--ink-faint);}
.search-results{
  position:absolute;
  top:calc(100% + 6px);
  left:0;right:0;
  background:var(--paper-raised);
  border:1px solid var(--line);
  border-radius:9px;
  box-shadow:var(--shadow);
  max-height:280px;overflow-y:auto;
  z-index:20;
  display:none;
}
.search-results.visible{display:block;}
.search-result-item{
  padding:10px 14px;
  cursor:pointer;
  display:flex;justify-content:space-between;align-items:center;
  gap:10px;
  border-bottom:1px solid var(--line);
  font-size:13px;
}
.search-result-item:last-child{border-bottom:none;}
.search-result-item:hover{background:var(--accent-tint);}
.search-result-unit{font-family:var(--font-mono);font-weight:600;color:var(--ink);}
.search-result-category{color:var(--ink-faint);font-size:11px;text-transform:capitalize;letter-spacing:0.03em;}
.search-empty{padding:14px;font-size:13px;color:var(--ink-faint);text-align:center;}

/* ---------- Category tabs (panel buttons) ---------- */
.category-controls{
  display:flex;justify-content:space-between;align-items:center;
  gap:10px;flex-wrap:wrap;margin-bottom:8px;
}
.category-tabs{
  display:grid;
  grid-template-columns:repeat(auto-fill, minmax(118px, 1fr));
  gap:6px;width:100%;
}
#miscCategoryTabs{margin-bottom:16px;}
.category-tab{
  padding:9px 10px;
  background:var(--paper-raised);
  border:1px solid var(--line);
  border-radius:7px;
  cursor:pointer;
  transition:all 0.15s ease;
  font-size:12.5px;
  font-weight:500;
  text-transform:capitalize;
  color:var(--ink);
  text-align:center;
  white-space:normal;
  line-height:1.2;
  min-height:40px;
  display:flex;
  align-items:center;
  justify-content:center;
}
.dark-mode .category-tab{color:#FFFFFF;}
.category-tab.active{
  background:#F4D29A;
  color:var(--ink);
  border-color:#E6B86C;
  font-weight:600;
}
.dark-mode .category-tab.active{background:#4B5560;border-color:#4B5560;color:#FFFFFF;}
.category-tab:hover:not(.active){border-color:var(--line-strong);background:var(--accent-tint);}

.misc-toggle-button{
  padding:8px 12px;
  background:transparent;
  color:var(--ink-soft);
  border:1px dashed var(--line-strong);
  border-radius:7px;
  cursor:pointer;
  font-size:12px;font-weight:500;
  white-space:nowrap;
}
.misc-toggle-button:hover{color:var(--ink);border-color:var(--ink-soft);}

.main-content-wrapper{overflow-x:auto;padding-bottom:4px;}

/* ---------- Converter panel ---------- */
.panel{
  background:var(--paper-raised);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:20px;
  box-shadow:var(--shadow-sm);
  margin-bottom:16px;
}

.converter-grid{
  display:grid;
  grid-template-columns:1fr 44px 1fr;
  gap:14px;
  align-items:end;
  min-width:480px;
}
.field-label{
  font-family:var(--font-mono);
  font-size:10.5px;
  font-weight:600;
  letter-spacing:0.1em;
  text-transform:uppercase;
  color:var(--ink-faint);
  margin-bottom:8px;
  display:block;
}
.input-container{display:flex;flex-direction:column;gap:8px;}

input[type="number"],select,input[type="text"]{
  padding:11px 13px;
  border:1px solid var(--line-strong);
  border-radius:7px;
  font-size:15px;
  font-family:var(--font-mono);
  transition:border-color 0.15s ease, box-shadow 0.15s ease;
  width:100%;
  background:var(--paper);
  color:var(--ink);
}
select{font-family:var(--font-ui);font-weight:500;cursor:pointer;}
input[readonly]{background:var(--paper-sunken);color:var(--ink-soft);}
input[type="number"]:focus,select:focus,input[type="text"]:focus{
  outline:none;
  border-color:var(--accent2);
  box-shadow:0 0 0 3px var(--accent2-tint);
}

.swap-button{
  background:var(--paper);
  border:1px solid var(--line-strong);
  border-radius:50%;
  width:40px;height:40px;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;
  transition:all 0.2s ease;
  margin:0 auto;
}
.swap-button:hover{background:var(--accent);border-color:var(--accent);transform:rotate(180deg);}
.swap-button svg{width:17px;height:17px;stroke:var(--ink-soft);fill:none;stroke-width:2;}
.swap-button:hover svg{stroke:#fff;}
.dark-mode .swap-button{color:var(--accent2);}
.dark-mode .swap-button svg{stroke:var(--accent2);}
.dark-mode .swap-button:hover{color:#fff;}
.dark-mode .swap-button:hover svg{stroke:#fff;}

/* ---------- Readout (signature element) ---------- */
.readout{
  background:var(--readout-bg);
  background-image:radial-gradient(ellipse at top, var(--readout-bg-2), var(--readout-bg) 70%);
  border-radius:9px;
  padding:18px 20px;
  margin-top:18px;
  box-shadow:inset 0 2px 6px rgba(0,0,0,0.5), inset 0 0 0 1px var(--readout-line);
  min-height:70px;
  display:flex;
  flex-direction:column;
  gap:4px;
}
.readout-label{
  font-family:var(--font-mono);
  font-size:10px;
  letter-spacing:0.16em;
  text-transform:uppercase;
  color:var(--readout-fg-dim);
}
.readout-row{
  display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;
}
.readout-value{
  font-family:var(--font-mono);
  font-size:21px;
  font-weight:600;
  color:var(--readout-fg);
  text-shadow:0 0 12px rgba(51,214,155,0.35);
  word-break:break-all;
  line-height:1.35;
}
.readout-empty{color:var(--readout-fg-dim);font-style:italic;font-size:14px;font-family:var(--font-ui);}
.readout-copy{
  background:none;border:1px solid var(--readout-line);
  color:var(--readout-fg-dim);
  border-radius:6px;
  padding:5px 8px;
  cursor:pointer;
  font-size:11px;font-family:var(--font-mono);
  display:flex;align-items:center;gap:5px;
  flex-shrink:0;
  transition:all 0.15s ease;
}
.readout-copy:hover{border-color:var(--readout-fg-dim);color:var(--readout-fg);}
.readout-copy svg{width:11px;height:11px;}
.readout-copy.copied{color:var(--readout-fg);border-color:var(--readout-fg);}

.meta-row{
  display:flex;justify-content:space-between;align-items:center;
  margin-top:10px;flex-wrap:wrap;gap:8px;
}
.conversion-factor{
  font-size:12.5px;
  color:var(--ink-soft);
  font-family:var(--font-mono);
}
.precision-control{
  display:flex;align-items:center;gap:6px;
  font-size:11.5px;color:var(--ink-faint);
}
.precision-control select{
  padding:4px 8px;font-size:12px;width:auto;
  border-radius:5px;
}

.error{
  color:var(--danger);
  background:var(--danger-bg);
  padding:10px 14px;
  border-radius:7px;
  margin-bottom:14px;
  font-size:13.5px;
  border:1px solid var(--danger);
}

/* ---------- Bulk / gas constant / history ---------- */
.section-label{
  font-family:var(--font-mono);
  font-size:10.5px;
  font-weight:600;
  letter-spacing:0.1em;
  text-transform:uppercase;
  color:var(--ink-faint);
  padding:12px 4px 8px;
}
.bulk-results,.history-panel{
  max-height:280px;
  overflow-y:auto;
  border:1px solid var(--line);
  border-radius:9px;
  background:var(--paper-raised);
}
.bulk-item,.history-item{
  padding:10px 14px;
  border-bottom:1px solid var(--line);
  display:flex;justify-content:space-between;align-items:center;
  font-size:13.5px;
}
.bulk-item:last-child,.history-item:last-child{border-bottom:none;}
.bulk-unit{color:var(--ink-soft);}
.bulk-value{font-family:var(--font-mono);font-weight:600;}
.history-item{cursor:pointer;gap:10px;}
.history-item:hover{background:var(--accent-tint);}
.history-text{font-family:var(--font-mono);font-size:12.5px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.history-cat{font-size:10.5px;color:var(--ink-faint);text-transform:capitalize;flex-shrink:0;}
.history-empty{padding:16px;text-align:center;color:var(--ink-faint);font-size:13px;}
.history-clear{font-size:11px;color:var(--ink-faint);background:none;border:none;cursor:pointer;text-decoration:underline;}
.history-clear:hover{color:var(--ink);}

.constant-section{padding:12px 16px;border-bottom:1px solid var(--line);}
.constant-section:last-child{border-bottom:none;}
.constant-section h3{font-size:13px;color:var(--ink-soft);margin-bottom:10px;font-family:var(--font-mono);letter-spacing:0.05em;text-transform:uppercase;font-weight:600;}
.constant-row{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px dashed var(--line);font-family:var(--font-mono);font-size:13px;}
.constant-row:last-child{border-bottom:none;}
.constant-value{font-weight:600;color:var(--ink);}
.constant-unit{color:var(--ink-soft);text-align:right;word-break:break-word;}

.app-info{
  margin-top:20px;
  text-align:center;
  font-size:12px;
  color:var(--ink-faint);
  padding-top:16px;
  border-top:1px solid var(--line);
}
.app-info a{color:var(--accent2);text-decoration:none;font-weight:600;}
.app-info a:hover{text-decoration:underline;}

/* ---------- Modal ---------- */
.modal-overlay{
  position:fixed;inset:0;
  background:rgba(10,14,16,0.6);
  display:flex;justify-content:center;align-items:center;
  z-index:1000;opacity:0;visibility:hidden;
  transition:opacity 0.2s ease,visibility 0.2s ease;
  padding:16px;
}
.modal-overlay.visible{opacity:1;visibility:visible;}
.modal-content{
  background:var(--paper);
  padding:22px;
  border-radius:12px;
  width:100%;max-width:800px;
  box-shadow:var(--shadow);
  transform:translateY(-30px);
  transition:transform 0.25s ease;
  display:flex;flex-direction:column;
  max-height:90vh;
  border:1px solid var(--line);
}
.modal-overlay.visible .modal-content{transform:translateY(0);}
.modal-header{
  display:flex;justify-content:space-between;align-items:center;
  margin-bottom:16px;padding-bottom:12px;
  border-bottom:1px solid var(--line);flex-shrink:0;
}
.modal-header h2{font-size:18px;font-weight:700;}
.close-button{background:none;border:none;font-size:22px;cursor:pointer;color:var(--ink-soft);line-height:1;padding:4px;}
.close-button:hover{color:var(--ink);}
.modal-body{overflow-y:auto;}
.modal-grid{display:flex;flex-wrap:wrap;gap:14px;}
.modal-section{
  border:1px solid var(--line);
  border-radius:8px;
  padding:14px;
  flex:1 1 220px;min-width:220px;
  background:var(--paper-raised);
}
.modal-section h3{font-size:13px;color:var(--ink-soft);margin-bottom:10px;font-family:var(--font-mono);text-transform:uppercase;letter-spacing:0.05em;}
.preset-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;}
.preset-chip{
  font-size:11px;padding:5px 9px;border-radius:20px;
  background:var(--paper-sunken);border:1px solid var(--line);
  color:var(--ink-soft);cursor:pointer;
}
.preset-chip:hover{border-color:var(--accent2);color:var(--accent2);}
.modal-result{
  margin-top:16px;
  background:var(--accent2-tint);
  background-image:radial-gradient(ellipse at top, rgba(30,139,116,0.18), var(--accent2-tint) 70%);
  border-radius:8px;
  padding:16px;text-align:center;
  min-height:50px;
  display:flex;flex-direction:column;justify-content:center;gap:2px;
  box-shadow:inset 0 2px 6px rgba(30,139,116,0.12), inset 0 0 0 1px rgba(30,139,116,0.28);
}
.modal-result-value{font-family:var(--font-mono);font-size:18px;font-weight:700;color:var(--readout-fg);word-break:break-all;text-shadow:0 0 10px rgba(51,214,155,0.3);}
.modal-result-placeholder{color:var(--readout-fg-dim);font-family:var(--font-ui);font-size:13px;font-style:italic;}

::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:4px;}

@media (max-width:768px){
  .converter-grid{grid-template-columns:1fr;gap:12px;min-width:unset;}
  .swap-button{transform:rotate(90deg);}
  .swap-button:hover{transform:rotate(270deg);}
  .readout-value{font-size:18px;}
  h1{font-size:22px;}
  .masthead{justify-content:center;text-align:center;}
  .masthead-titles{align-items:center;}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none !important;}
}
</style>
</head>
<body>
<div class="app-shell">

<div class="masthead">
  <div class="masthead-titles">
    <span class="eyebrow">Chemical Engineering</span>
    <h1>Unit Converter</h1>
  </div>
  <div class="masthead-controls">
    <button id="historyToggleButton" class="btn btn-ghost" title="Conversion history">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
      History
    </button>
    <button id="flowRateEquivButton" class="btn btn-primary">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
      Flow Rate Equivalence
    </button>
    <label class="theme-switch" id="themeSwitchWrap" title="Toggle dark mode">
      <input type="checkbox" id="theme-toggle" aria-label="Toggle dark mode"/>
      <div class="theme-knob">
        <svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/></svg>
      </div>
    </label>
  </div>
</div>

<div class="search-wrap">
  <div class="search-field">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input type="text" id="unitSearch" placeholder="Jump to a unit or category — e.g. psi, kW, viscosity">
  </div>
  <div id="searchResults" class="search-results"></div>
</div>

<div class="category-controls">
  <div class="category-tabs" id="commonCategoryTabs"></div>
</div>
<div style="margin-bottom:8px;">
  <button id="toggleMiscButton" class="misc-toggle-button">Show more categories</button>
</div>
<div class="category-tabs" id="miscCategoryTabs" style="display:none;"></div>

<div id="errorMessage" class="error" style="display:none;"></div>

<div class="panel" id="mainContentWrapper">
  <div class="main-content-wrapper">
    <div class="converter-grid">
      <div class="input-group">
        <label class="field-label" for="fromValue">From</label>
        <div class="input-container">
          <input type="number" id="fromValue" placeholder="Enter value" step="any">
          <select id="fromUnit"></select>
        </div>

      <button class="swap-button" id="swapButton" title="Swap units">

// --- UTILITY FUNCTIONS ---
function formatNumber(num, precision = 6) {
  if (num === null || num === undefined || isNaN(num)) return "";
  if (num === 0) return '0';
  const absNum = Math.abs(num);
  if (absNum >= 1e10 || (absNum > 0 && absNum < 1e-4)) {
    return num.toExponential(Math.max(precision - 4, 2));
  }
  return parseFloat(num.toPrecision(precision)).toString();
}

function formatUnitHTML(unit) {
  if (!unit) return '';
  return unit
    .replace(/²/g, '<sup>2</sup>')
    .replace(/³/g, '<sup>3</sup>')
    .replace(/_/g, ' ');
}

function formatUnitText(unit) {
  if (!unit) return '';
  return unit.replace(/_/g, ' ');
}

class UnitConverter {
  constructor() {

    };
    this.thermal_conductivity_units = {
      'W/(m·K)': 1, 'kW/(m·K)': 1000, 'Btu/(h·ft·°F)': 1.73073
    };
    this.heat_transfer_coefficient_units = {
      'W/m²·K': 1, 'kW/m²·K': 1000, 'MW/m²·K': 1e6,
      'btu/s·ft²·°F': 20441.75, 'btu/h·ft²·°F': 5.67826,
      'kcal/s·m²·°C': 4186.8, 'kcal/h·m²·°C': 1.16222
    };
    this.mass_concentration_units = {
      'kg/m³': 1, 'g/L': 1, 'g/cm³': 1000,
      'mg/L': 0.001, 'ppm (mg/L)': 0.001, 'ppb (μg/L)': 0.000001,
      'lb/ft³': 16.0185, 'lb/gal (US)': 119.826
    };
    this.molar_concentration_units = {
      'kmol/m³': 1, 'mol/m³': 0.001, 'M (mol/L)': 1,
      'mmol/L': 0.001, 'μmol/L': 0.000001, 'mol/cm³': 1000
    };
    this.electric_charge_units = { 'faraday': 96485.3, 'C': 1, 'mC': 1e-3, 'μC': 1e-6, 'nC': 1e-9, 'e': 1.60218e-19 };
    this.electric_resistance_units = { 'GΩ': 1e9, 'MΩ': 1e6, 'kΩ': 1000, 'Ω': 1, 'milliΩ': 1e-3, 'microΩ': 1e-6 };
    this.electric_potential_units = { 'kV': 1000, 'V': 1, 'mV': 1e-3, 'uV': 1e-6 };
    this.electric_capacitance_units = { 'F': 1, 'mF': 1e-3, 'μF': 1e-6, 'nF': 1e-9, 'pF': 1e-12 };
    this.luminance_units = { 'stilb': 10000, 'lambert': 3183.1, 'cd/m²': 1, 'nit': 1, 'foot_lambert': 3.42626 };
    this.magnetic_field_units = { 'T': 1, 'mT': 1e-3, 'μT': 1e-6, 'gauss': 1e-4 };
    this.angle_units = { 'turn': 2 * Math.PI, 'rad': 1, 'grad': Math.PI / 200, 'deg': Math.PI / 180, 'arcmin': Math.PI / 10800, 'arcsec': Math.PI / 648000 };

    this.categories = {
      'length': this.length_units, 'weight': this.weight_units, 'volume': this.volume_units, 'area': this.area_units, 'time': this.time_units, 'speed': this.speed_units,
      'pressure': this.pressure_units, 'energy': this.energy_units, 'duty': this.duty_units, 'force': this.force_units, 'torque': this.torque_units, 'acceleration': this.acceleration_units,

      'molar_mass': this.molar_mass_units, 'frequency': this.frequency_units, 'density': this.density_units, 'dynamic_viscosity': this.dynamic_viscosity_units, 'kinematic_viscosity': this.kinematic_viscosity_units,

  getAvailableCategories() { return Object.keys(this.categories).concat(['temperature']); }
  getUnitsForCategory(category) { return category === 'temperature' ? this.temperature_units : Object.keys(this.categories[category] || {}); }

  findUnitCategory(unit) {
    if (this.temperature_units.includes(unit.toLowerCase())) return 'temperature';
    for (const [category, units] of Object.entries(this.categories)) {
      if (unit in units) return category;
    }
    return null;
  }

  convert(value, fromUnit, toUnit, preferredCategory = null) {
    const fromCategory = preferredCategory || this.findUnitCategory(fromUnit);
    const toCategory = preferredCategory || this.findUnitCategory(toUnit);

    if (!fromCategory || !toCategory) throw new Error(`Unknown unit.`);
    if (fromCategory !== toCategory) throw new Error(`Cannot convert between categories.`);

    if (fromCategory === 'temperature') return { value: this.convertTemperature(value, fromUnit, toUnit) };
    if (fromCategory === 'pressure') return { value: this.convertPressure(value, fromUnit, toUnit) };

    const unitsDict = this.categories[fromCategory];
    if (!unitsDict || !(fromUnit in unitsDict) || !(toUnit in unitsDict)) {
      throw new Error(`Unit does not belong to selected category.`);
    }

    return { value: value * unitsDict[fromUnit] / unitsDict[toUnit] };
  }

  convertFlowRate({ fromType, fromValue, fromUnit, toType, toUnit, densityValue, densityUnit, molarMassValue, molarMassUnit }) {
    const fromValueSI = fromValue * this.categories[fromType][fromUnit];
    let densitySI = densityValue ? densityValue * this.categories['density'][densityUnit] : null;
    let molarMassSI = molarMassValue ? molarMassValue * this.categories['molar_mass'][molarMassUnit] : null;

    if (molarMassSI) molarMassSI /= 1000;

    let massFlowSI;
    if (fromType === 'mass_flow_rate') {
      massFlowSI = fromValueSI;
    } else if (fromType === 'volumetric_flow_rate') {
      if (!densitySI) throw new Error("Density is required.");
      massFlowSI = fromValueSI * densitySI;
    } else if (fromType === 'molar_flow_rate') {
      if (!molarMassSI) throw new Error("Molar Mass is required.");
      massFlowSI = fromValueSI * molarMassSI;
    } else {
      throw new Error("Invalid 'from' flow type.");
    }

    let toValueSI;
    if (toType === 'mass_flow_rate') {
      toValueSI = massFlowSI;
    } else if (toType === 'volumetric_flow_rate') {
      if (!densitySI || densitySI === 0) throw new Error("Valid density is required.");
      toValueSI = massFlowSI / densitySI;
    } else if (toType === 'molar_flow_rate') {
      if (!molarMassSI || molarMassSI === 0) throw new Error("Valid molar mass is required.");
      toValueSI = massFlowSI / molarMassSI;
    } else {
      throw new Error("Invalid 'to' flow type.");
    }

    return toValueSI / this.categories[toType][toUnit];
  }

  convertTemperature(value, fromUnit, toUnit) {
    let celsius;
    switch (fromUnit.toLowerCase()) {
      case 'fahrenheit': celsius = (value - 32) * 5 / 9; break;
      case 'kelvin': celsius = value - 273.15; break;
      case 'rankine': celsius = (value - 491.67) * 5 / 9; break;
      default: celsius = value;
    }
    switch (toUnit.toLowerCase()) {
      case 'celsius': return celsius;
      case 'fahrenheit': return celsius * 9 / 5 + 32;
      case 'kelvin': return celsius + 273.15;
      case 'rankine': return (celsius + 273.15) * 9 / 5;
      default: throw new Error(`Unknown temperature unit: ${toUnit}`);
    }
  }

  convertPressure(value, fromUnit, toUnit) {
    const unitsDict = this.categories['pressure'];
    const fromIsGauge = fromUnit.endsWith('-g');
    const fromBaseUnit = fromIsGauge ? fromUnit.slice(0, -2) : fromUnit;
    let valueInPascals = value * unitsDict[fromBaseUnit];
    if (fromIsGauge) valueInPascals += this.standardAtmospherePa;

    const toIsGauge = toUnit.endsWith('-g');
    const toBaseUnit = toIsGauge ? toUnit.slice(0, -2) : toUnit;
    if (toIsGauge) {
      return (valueInPascals - this.standardAtmospherePa) / unitsDict[toBaseUnit];
    }
    return valueInPascals / unitsDict[toBaseUnit];
  }

  bulkConvert(value, fromUnit, preferredCategory = null) {
    const fromCategory = preferredCategory || this.findUnitCategory(fromUnit);
    if (!fromCategory) return {};
    const results = {};
    for (const unit of this.getUnitsForCategory(fromCategory)) {
      try { results[unit] = this.convert(value, fromUnit, unit, fromCategory).value; } catch (e) { /* skip */ }
    }
    return results;
  }
}

    this.toValue = document.getElementById('toValue');
    this.toUnit = document.getElementById('toUnit');
    this.swapButton = document.getElementById('swapButton');
    this.resultDisplay = document.getElementById('resultDisplay');
    this.copyResultButton = document.getElementById('copyResultButton');
    this.conversionFactor = document.getElementById('conversionFactor');
    this.precisionSelect = document.getElementById('precisionSelect');
    this.bulkResults = document.getElementById('bulkResults');
    this.bulkLabel = document.getElementById('bulkLabel');
    this.resultBox = document.getElementById('resultBox');
    this.mainContentWrapper = document.getElementById('mainContentWrapper');
    this.gasConstantPanel = document.getElementById('gasConstantPanel');
    this.unitSearch = document.getElementById('unitSearch');
    this.searchResults = document.getElementById('searchResults');
    this.historyToggleButton = document.getElementById('historyToggleButton');
    this.historyWrapper = document.getElementById('historyWrapper');
    this.historyPanel = document.getElementById('historyPanel');
    this.clearHistoryButton = document.getElementById('clearHistoryButton');

    this.flowRateModal = document.getElementById('flowRateModal');
    this.flowRateEquivButton = document.getElementById('flowRateEquivButton');
    this.closeModalButton = document.getElementById('closeModalButton');
    this.flowFromType = document.getElementById('flowFromType');
    this.flowToType = document.getElementById('flowToType');
    this.flowFromUnit = document.getElementById('flowFromUnit');
    this.flowToUnit = document.getElementById('flowToUnit');
    this.densitySection = document.getElementById('densitySection');
    this.molarMassSection = document.getElementById('molarMassSection');
    this.densityUnit = document.getElementById('densityUnit');
    this.molarMassUnit = document.getElementById('molarMassUnit');
    this.densityValue = document.getElementById('densityValue');
    this.molarMassValue = document.getElementById('molarMassValue');
    this.flowFromValue = document.getElementById('flowFromValue');
    this.densityPresets = document.getElementById('densityPresets');
    this.molarMassPresets = document.getElementById('molarMassPresets');
    this.flowResult = document.getElementById('flowResult');
  }

  setupEventListeners() {
    this.themeToggle.addEventListener('change', () => this.toggleTheme());
    this.fromValue.addEventListener('input', () => this.performConversion());
    this.fromValue.addEventListener('keydown', (e) => { if (e.key === 'Enter') this.commitHistory(); });
    this.fromValue.addEventListener('blur', () => this.commitHistory());
    this.fromUnit.addEventListener('change', () => this.performConversion());
    this.toUnit.addEventListener('change', () => this.performConversion());
    this.swapButton.addEventListener('click', () => this.swapUnits());
    this.toggleMiscButton.addEventListener('click', () => this.toggleMiscCategories());
    this.precisionSelect.addEventListener('change', () => {
      this.precision = parseInt(this.precisionSelect.value, 10);
      this.performConversion();
    });
    this.copyResultButton.addEventListener('click', () => this.copyResult());

    this.unitSearch.addEventListener('input', () => this.runSearch());
    this.unitSearch.addEventListener('focus', () => { if (this.unitSearch.value.trim()) this.runSearch(); });
    document.addEventListener('click', (e) => {
      if (!this.searchResults.contains(e.target) && e.target !== this.unitSearch) {
        this.searchResults.classList.remove('visible');
      }
    });

    this.historyToggleButton.addEventListener('click', () => this.toggleHistory());
    this.clearHistoryButton.addEventListener('click', () => { this.history = []; this.renderHistory(); });

    this.flowRateEquivButton.addEventListener('click', () => this.openModal());
    this.closeModalButton.addEventListener('click', () => this.closeModal());
    this.flowRateModal.addEventListener('click', (e) => { if (e.target === this.flowRateModal) this.closeModal(); });
    this.flowFromType.addEventListener('change', () => this.updateModalUI());
    this.flowToType.addEventListener('change', () => this.updateModalUI());
    this.flowFromValue.addEventListener('input', () => this.performFlowConversion());
    this.flowFromUnit.addEventListener('change', () => this.performFlowConversion());
    this.flowToUnit.addEventListener('change', () => this.performFlowConversion());
    this.densityValue.addEventListener('input', () => this.performFlowConversion());
    this.densityUnit.addEventListener('change', () => this.performFlowConversion());
    this.molarMassValue.addEventListener('input', () => this.performFlowConversion());
    this.molarMassUnit.addEventListener('change', () => this.performFlowConversion());

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        if (this.flowRateModal.classList.contains('visible')) this.closeModal();
        this.searchResults.classList.remove('visible');
      }
    });
  }

  initializeUI() {
    const savedTheme = window.localStorage.getItem('theme');
    const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    const useDarkMode = savedTheme ? savedTheme === 'dark' : prefersDark;
    document.body.classList.toggle('dark-mode', useDarkMode);
    this.themeToggle.checked = useDarkMode;
    this.createCategoryTabs();
    this.updateUnitsForCategory(this.currentCategory);
    this.updateCategoryMode(this.currentCategory);
    this.renderPresets();
    this.updateModalUI();
    this.renderHistory();
  }

  renderPresets() {
    const build = (container, key) => {
      container.innerHTML = '';
      this.substancePresets.forEach(p => {
        const chip = document.createElement('button');
        chip.type = 'button';
        chip.className = 'preset-chip';
        chip.textContent = p.label;
        chip.addEventListener('click', () => {
          if (key === 'density') {
            this.densityValue.value = p.density;
            this.densityUnit.value = 'kg/m³';
          } else {
            this.molarMassValue.value = p.molarMass;
            this.molarMassUnit.value = 'kg/kmol';
          }
          this.performFlowConversion();
        });
        container.appendChild(chip);
      });
    };
    build(this.densityPresets, 'density');
    build(this.molarMassPresets, 'molarMass');
  }

  renderGasConstantValues() {
    const renderSection = (title, rows) => {
      const section = document.createElement('div');
      section.className = 'constant-section';
      const heading = document.createElement('h3');
      heading.textContent = title;
      section.appendChild(heading);
      rows.forEach((row) => {
        const item = document.createElement('div');
        item.className = 'constant-row';
        item.innerHTML = `<span class="constant-value">${row.value}</span><span class="constant-unit">${formatUnitHTML(row.unit)}</span>`;
        section.appendChild(item);
      });
      return section;
    };
    this.gasConstantPanel.innerHTML = '';
    this.gasConstantPanel.appendChild(renderSection('SI units', this.gasConstantValues.si));
    this.gasConstantPanel.appendChild(renderSection('Other common units', this.gasConstantValues.other));
  }

  updateCategoryMode(category) {
    const isGasConstant = category === 'gas_constant';
    this.mainContentWrapper.style.display = isGasConstant ? 'none' : 'block';
    this.resultBox.style.display = isGasConstant ? 'none' : 'flex';
    this.conversionFactor.style.display = isGasConstant ? 'none' : 'block';

    if (isGasConstant) {
      this.conversionFactor.textContent = '';
      this.hideError();
      this.hideBulkResults();
      this.gasConstantPanel.style.display = 'block';
      this.renderGasConstantValues();
    } else {
      this.gasConstantPanel.style.display = 'none';
    }
  }

  toggleTheme() {
    const useDarkMode = this.themeToggle.checked;
    document.body.classList.toggle('dark-mode', useDarkMode);
    window.localStorage.setItem('theme', useDarkMode ? 'dark' : 'light');
  }

  toggleHistory() {
    const isHidden = this.historyWrapper.style.display === 'none';
    this.historyWrapper.style.display = isHidden ? 'block' : 'none';
  }

  renderHistory() {
    if (!this.history.length) {
      this.historyPanel.innerHTML = '<div class="history-empty">No conversions yet this session</div>';
      return;
    }
    this.historyPanel.innerHTML = '';
    this.history.slice().reverse().forEach((h) => {
      const item = document.createElement('div');
      item.className = 'history-item';
      item.innerHTML = `<span class="history-text">${formatNumber(h.value, 6)} ${formatUnitText(h.fromUnit)} → ${formatNumber(h.result, 6)} ${formatUnitText(h.toUnit)}</span><span class="history-cat">${formatUnitText(h.category)}</span>`;
      item.addEventListener('click', () => this.restoreHistory(h));
      this.historyPanel.appendChild(item);
    });
  }

  restoreHistory(h) {
    this.switchCategory(h.category);
    this.fromValue.value = h.value;
    this.fromUnit.value = h.fromUnit;
    this.toUnit.value = h.toUnit;
    this.performConversion();
  }

  commitHistory() {
    if (this.currentCategory === 'gas_constant') return;
    const value = parseFloat(this.fromValue.value);
    if (isNaN(value)) return;
    try {
      const fromUnit = this.fromUnit.value;
      const toUnit = this.toUnit.value;
      const result = this.converter.convert(value, fromUnit, toUnit, this.currentCategory).value;
      const last = this.history[this.history.length - 1];
      if (last && last.value === value && last.fromUnit === fromUnit && last.toUnit === toUnit && last.category === this.currentCategory) return;
      this.history.push({ value, fromUnit, toUnit, result, category: this.currentCategory });
      if (this.history.length > 12) this.history.shift();
      this.renderHistory();
    } catch (e) { /* ignore */ }
  }

  copyResult() {
    const text = this.toValue.value;
    if (!text) return;
    const done = () => {
      this.copyResultButton.classList.add('copied');
      const original = this.copyResultButton.innerHTML;
      this.copyResultButton.innerHTML = 'Copied';
      setTimeout(() => { this.copyResultButton.innerHTML = original; this.copyResultButton.classList.remove('copied'); }, 1300);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done).catch(() => {});
    }
  }

  runSearch() {
    const query = this.unitSearch.value.trim().toLowerCase();
    if (!query) { this.searchResults.classList.remove('visible'); return; }
    const matches = [];
    this.converter.getAvailableCategories().forEach(category => {
      const units = this.converter.getUnitsForCategory(category);
      units.forEach(unit => {
        if (unit.toLowerCase().includes(query) || category.toLowerCase().includes(query)) {
          matches.push({ unit, category });
        }
      });
    });
    this.searchResults.innerHTML = '';
    if (!matches.length) {
      this.searchResults.innerHTML = '<div class="search-empty">No matching units or categories</div>';
    } else {
      matches.slice(0, 20).forEach(m => {
        const item = document.createElement('div');
        item.className = 'search-result-item';
        item.innerHTML = `<span class="search-result-unit">${formatUnitHTML(m.unit)}</span><span class="search-result-category">${formatUnitText(m.category)}</span>`;
        item.addEventListener('click', () => {
          this.switchCategory(m.category);
          if (m.category !== 'gas_constant') this.fromUnit.value = m.unit;
          this.performConversion();
          this.unitSearch.value = '';
          this.searchResults.classList.remove('visible');
        });
        this.searchResults.appendChild(item);
      });
    }
    this.searchResults.classList.add('visible');
  }

  openModal() { this.flowRateModal.classList.add('visible'); }
  closeModal() { this.flowRateModal.classList.remove('visible'); }

  updateModalUI() {
    const from = this.flowFromType.value;
    const to = this.flowToType.value;

    this.populateSelect(this.flowFromUnit, this.converter.getUnitsForCategory(from));
    this.populateSelect(this.flowToUnit, this.converter.getUnitsForCategory(to));
    this.populateSelect(this.densityUnit, this.converter.getUnitsForCategory('density'));
    this.populateSelect(this.molarMassUnit, this.converter.getUnitsForCategory('molar_mass'));

    const needsDensity = (from.includes('volumetric') && !to.includes('volumetric')) || (!from.includes('volumetric') && to.includes('volumetric'));
    const needsMolarMass = (from.includes('molar') && !to.includes('molar')) || (!from.includes('molar') && to.includes('molar'));

    this.densitySection.style.display = needsDensity ? 'block' : 'none';
    this.molarMassSection.style.display = needsMolarMass ? 'block' : 'none';

    this.performFlowConversion();
  }

  performFlowConversion() {
    const rawFromValue = this.flowFromValue.value;
    const fromValue = parseFloat(rawFromValue);

    if (rawFromValue.trim() === '' || isNaN(fromValue)) {
      this.flowResult.className = 'modal-result-placeholder';
      this.flowResult.textContent = 'Result will be shown here';
      return;
    }

    try {
      const params = {
        fromType: this.flowFromType.value,
        fromValue,
        fromUnit: this.flowFromUnit.value,
        toType: this.flowToType.value,
        toUnit: this.flowToUnit.value,
        densityValue: parseFloat(this.densityValue.value),
        densityUnit: this.densityUnit.value,
        molarMassValue: parseFloat(this.molarMassValue.value),
        molarMassUnit: this.molarMassUnit.value,
      };

      const result = this.converter.convertFlowRate(params);
      this.flowResult.className = 'modal-result-value';
      this.flowResult.innerHTML = `${formatNumber(result, this.precision)} ${formatUnitHTML(params.toUnit)}`;
    } catch (error) {
      this.flowResult.className = 'modal-result-value';
      this.flowResult.textContent = `Error: ${error.message}`;
    }
  }

  createCategoryTabs() {
    const createTabs = (container, categories) => {
      container.innerHTML = '';
      categories.forEach(category => {
        const tab = document.createElement('div');
        tab.className = `category-tab ${category === this.currentCategory ? 'active' : ''}`;
        tab.innerHTML = formatUnitHTML(category.replace(/_/g, ' '));
        tab.dataset.category = category;
        tab.addEventListener('click', () => this.switchCategory(category));
        container.appendChild(tab);
      });
    };
    createTabs(this.commonCategoryTabs, this.commonCategories);
    createTabs(this.miscCategoryTabs, this.miscellaneousCategories);
  }

  toggleMiscCategories() {
    const isHidden = this.miscCategoryTabs.style.display === 'none';
    this.miscCategoryTabs.style.display = isHidden ? 'grid' : 'none';
    this.toggleMiscButton.textContent = isHidden ? 'Hide extra categories' : 'Show more categories';
  }

  switchCategory(category) {
    this.currentCategory = category;
    this.updateCategoryMode(category);
    this.updateUnitsForCategory(category);
    this.createCategoryTabs();
    if (category !== 'gas_constant') {
      this.performConversion();
    }
  }

  populateSelect(selectElement, units) {
    const currentVal = selectElement.value;
    selectElement.innerHTML = '';
    units.forEach(unit => {
      const option = document.createElement('option');
      option.value = unit;
      option.innerHTML = formatUnitHTML(unit);
      selectElement.appendChild(option);
    });
    if ([...selectElement.options].some(o => o.value === currentVal)) {
      selectElement.value = currentVal;
    }
  }

  updateUnitsForCategory(category) {
    if (category === 'gas_constant') return;
    const units = this.converter.getUnitsForCategory(category);
    this.populateSelect(this.fromUnit, units);
    this.populateSelect(this.toUnit, units);
    if (units.length > 1) {
      this.toUnit.selectedIndex = (this.fromUnit.selectedIndex === 0) ? 1 : 0;
    }
  }

  performConversion() {
    if (this.currentCategory === 'gas_constant') return;
    this.hideError();
    this.updateConversionFactor();
    const value = parseFloat(this.fromValue.value);
    if (isNaN(value) || this.fromValue.value === '') {
      this.resultDisplay.textContent = 'Enter a value to see the conversion';
      this.resultDisplay.className = 'readout-empty';
      this.toValue.value = '';
      this.hideBulkResults();
      return;
    }

    try {
      const fromUnit = this.fromUnit.value;
      const toUnit = this.toUnit.value;
      const result = this.converter.convert(value, fromUnit, toUnit, this.currentCategory);
      const formattedResult = formatNumber(result.value, this.precision);
      this.toValue.value = formattedResult;

      this.resultDisplay.innerHTML = `${formatNumber(value, this.precision)} ${formatUnitHTML(fromUnit)} = ${formattedResult} ${formatUnitHTML(toUnit)}`;
      this.resultDisplay.className = 'readout-value';
      this.displayBulkResults(value, fromUnit);
    } catch (error) {
      this.showError(error.message);
      this.toValue.value = '';
      this.resultDisplay.textContent = 'Conversion error';
      this.resultDisplay.className = 'readout-empty';
      this.hideBulkResults();
    }
  }

  updateConversionFactor() {
    const fromUnit = this.fromUnit.value;
    const toUnit = this.toUnit.value;
    if (!fromUnit || !toUnit) {
      this.conversionFactor.textContent = '';
      return;
    }
    try {
      const zero = this.converter.convert(0, fromUnit, toUnit, this.currentCategory).value;
      const one = this.converter.convert(1, fromUnit, toUnit, this.currentCategory).value;
      const slope = one - zero;
      const intercept = zero;
      const isAffine = Math.abs(intercept) > 1e-9 * Math.max(1, Math.abs(slope));

      if (!isAffine) {
        // Pure proportional relationship: A2 = constant * A1
        this.conversionFactor.innerHTML = `1 ${formatUnitHTML(fromUnit)} = ${formatNumber(slope, this.precision)} ${formatUnitHTML(toUnit)}`;
      } else {
        // Affine relationship (offset involved, e.g. temperature, gauge<->absolute pressure):
        // A2 = slope * A1 + intercept
        this.conversionFactor.innerHTML = this.formatAffineFormula(slope, intercept, fromUnit, toUnit);
      }
    } catch (error) {
      this.conversionFactor.textContent = '';
    }
  }

  formatAffineFormula(slope, intercept, fromUnit, toUnit) {
    const fromSym = formatUnitHTML(fromUnit);
    const toSym = formatUnitHTML(toUnit);
    const sign = intercept >= 0 ? '+' : '\u2212';
    const interceptAbs = formatNumber(Math.abs(intercept), this.precision);

    let left;
    if (Math.abs(slope - 1) < 1e-9) {
      left = `${fromSym} ${sign} ${interceptAbs}`;
    } else {
      const slopeFmt = formatNumber(slope, this.precision);
      left = `${fromSym} \u00d7 ${slopeFmt} ${sign} ${interceptAbs}`;
    }
    return `${left} = ${toSym}`;
  }

  swapUnits() {
    if (this.currentCategory === 'gas_constant') return;
    const fromUnitValue = this.fromUnit.value;
    this.fromUnit.value = this.toUnit.value;
    this.toUnit.value = fromUnitValue;
    this.performConversion();
  }

  displayBulkResults(value, fromUnit) {
    if (this.currentCategory === 'gas_constant') { this.hideBulkResults(); return; }
    try {
      const results = this.converter.bulkConvert(value, fromUnit, this.currentCategory);
      if (Object.keys(results).length <= 1) { this.hideBulkResults(); return; }
      this.bulkResults.innerHTML = '';
      const sortedUnitKeys = this.converter.getUnitsForCategory(this.currentCategory);
      sortedUnitKeys.forEach(unit => {
        if (unit.toLowerCase() !== fromUnit.toLowerCase()) {
          const result = results[unit];
          if (result === undefined) return;
          const item = document.createElement('div');
          item.className = 'bulk-item';
          item.innerHTML = `<span class="bulk-unit">${formatUnitHTML(unit)}</span><span class="bulk-value">${formatNumber(result, this.precision)}</span>`;
          this.bulkResults.appendChild(item);
        }
      });
      this.bulkResults.style.display = 'block';
      this.bulkLabel.style.display = 'block';
    } catch (error) { this.hideBulkResults(); }
  }

  hideBulkResults() { this.bulkResults.style.display = 'none'; this.bulkLabel.style.display = 'none'; }
  showError(message) { this.errorMessage.textContent = message; this.errorMessage.style.display = 'block'; }
  hideError() { this.errorMessage.style.display = 'none'; }
}

document.addEventListener('DOMContentLoaded', () => { new ConverterUI(); });
</script>
</body>
</html>
